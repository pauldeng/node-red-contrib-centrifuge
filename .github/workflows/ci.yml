name: CI
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "17 6 * * 1" }] # weekly: new advisories surface without a PR
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  fast:
    name: unit, contracts, runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy: { fail-fast: false, matrix: { node: ["24", "26"] } } # 24 = engines floor; the package-contract test asserts it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - uses: actions/cache@v5
        with: { path: .cache/centrifugo, key: "centrifugo-6.9.4-${{ runner.os }}-${{ runner.arch }}" }
      - run: npm run lint && npm run format:check
      - run: npm test # unit, package contracts, and runtime; each runs once
        timeout-minutes: 6
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
  heavy:
    name: editor dialogs (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        timeout-minutes: 6
      - if: failure()
        uses: actions/upload-artifact@v6
        with: { name: traces, path: test-results/, if-no-files-found: ignore, retention-days: 7 }
  docker:
    name: docker tiers (integration, ui, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run docker:ensure
      - run: docker pull centrifugo/centrifugo@sha256:78b2fcd11e69f7cd82072924db99865be2beba4a03087d8ce0f5008ae357abe4 && docker pull nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236 && docker pull nodered/node-red:5.0.7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docker
        timeout-minutes: 6
      - run: npm run test:ui
        timeout-minutes: 6
      - run: npm run test:e2e:browser
        timeout-minutes: 8
      - if: failure()
        uses: actions/upload-artifact@v6
        with: { name: docker-traces, path: test-results/, if-no-files-found: ignore, retention-days: 7 }
